<style>
/* Layout: calm "match programme" console — light paper ground, one panel per question, big readable numbers; team identity = red (home) / blue (away); AI layer visually fenced as a demo. Light-first with a dark toggle. */
:root{
  color-scheme: light;
  --bg:#F3F4F0; --panel:#FFFFFF; --panel2:#F6F7F3; --line:#E0E4DC; --line2:#C9D0C5;
  --ink:#171C21; --ink2:#4A535D; --ink3:#76808A;
  --accent:#157A4A; --accent2:#0E5C37; --on-accent:#FFFFFF; --accent-soft:#E3F2E8;
  --home:#D7263D; --away:#1F5FBF; --home-soft:#FBE4E7; --away-soft:#E2EBFA;
  --good:#1C8E3C; --warn:#A8780A; --serious:#C95A22; --crit:#C62828;
  --pitch:#E8F1E3; --pitchline:#B6CBAE; --pitchdot-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,20,.05),0 10px 30px rgba(20,30,20,.06);
  --f-disp:'Oswald',system-ui,sans-serif; --f-body:'Golos Text',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#0B0E11; --panel:#12161B; --panel2:#1A2026; --line:#242C34; --line2:#303A44;
  --ink:#F2F5F7; --ink2:#A9B4BD; --ink3:#71808C;
  --accent:#C8F169; --accent2:#DAFF84; --on-accent:#10150A; --accent-soft:#1E2A14;
  --home:#F0566A; --away:#5B93F2; --home-soft:#3A1A20; --away-soft:#17253D;
  --good:#3FBF5C; --warn:#FAB219; --serious:#EC835A; --crit:#E05252;
  --pitch:#101713; --pitchline:#2E3B33; --pitchdot-ink:#0B0E11;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0B0E11; --panel:#12161B; --panel2:#1A2026; --line:#242C34; --line2:#303A44;
  --ink:#F2F5F7; --ink2:#A9B4BD; --ink3:#71808C;
  --accent:#C8F169; --accent2:#DAFF84; --on-accent:#10150A; --accent-soft:#1E2A14;
  --home:#F0566A; --away:#5B93F2; --home-soft:#3A1A20; --away-soft:#17253D;
  --good:#3FBF5C; --warn:#FAB219; --serious:#EC835A; --crit:#E05252;
  --pitch:#101713; --pitchline:#2E3B33; --pitchdot-ink:#0B0E11;
  --shadow:none;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg{display:block;max-width:100%}
svg text{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
h1,h2,h3,h4{text-wrap:balance}

/* ---------- app bar ---------- */
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.bmark{width:30px;height:30px;flex:none}
.bname{font-family:var(--f-disp);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase;line-height:1;white-space:nowrap}
.bname small{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.26em;color:var(--ink3);margin-top:3px}
.hspace{flex:1}
.ctrl{display:flex;align-items:center;gap:8px}
.pillbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;color:var(--ink2);background:var(--panel)}
.pillbtn:hover{border-color:var(--accent);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;padding:6px 12px;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:500}
.source-pill{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}

/* match head */
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:16px 10px}
.teamb{display:flex;align-items:center;gap:12px;min-width:0}
.teamb.right{justify-content:flex-end;text-align:right}
.crest{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:14px;color:#fff;flex:none;letter-spacing:.04em}
.crest.h{background:var(--home)} .crest.a{background:var(--away)}
.tname{font-family:var(--f-disp);font-weight:600;font-size:26px;line-height:1.05}
.tsub{font-family:var(--f-mono);font-size:11px;color:var(--ink3);letter-spacing:.06em}
.score{font-family:var(--f-disp);font-weight:600;font-size:48px;line-height:1;letter-spacing:.04em;text-align:center}
.score small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink3);margin-top:4px;font-weight:400}
.mmeta2{display:none;grid-column:1/-1;text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);margin-top:-6px}
@media(max-width:620px){.tname{font-size:19px}.score{font-size:36px}.crest{width:36px;height:36px;font-size:12px}.mhead{gap:10px;row-gap:4px}.score small{display:none}.mmeta2{display:block}}
@media(max-width:430px){.tname{font-size:16px}.score{font-size:30px;letter-spacing:.02em}.crest{width:32px;height:32px;font-size:11px}.teamb{gap:8px}.mhead{gap:6px;row-gap:4px}}

/* tabs */
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font-family:var(--f-disp);font-weight:500;font-size:15.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:11px 14px 9px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink2)}
nav.tabs button.ai{color:var(--accent)}
nav.tabs button.ai[aria-selected="true"]{color:var(--ink)}

/* ---------- panels ---------- */
main{padding-block:20px 10px}
section.tab{display:grid;gap:18px}
section.tab[hidden]{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px;min-width:0;box-shadow:var(--shadow)}
.card.soft{background:var(--panel2);box-shadow:none}
.ctitle{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-family:var(--f-disp);font-weight:600;font-size:20px;letter-spacing:.04em;flex-wrap:wrap}
.ctitle .sub{font-family:var(--f-body);font-size:13px;color:var(--ink3);font-weight:400;letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid32{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}
.grid23{display:grid;grid-template-columns:1fr 1.45fr;gap:18px}
@media(max-width:880px){.grid2,.grid32,.grid23{grid-template-columns:1fr}}
.footnote{font-size:12.5px;color:var(--ink3);margin-top:8px}
.lead{font-size:16px;color:var(--ink2);margin:0 0 12px;max-width:72ch}

/* info popover */
.info{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);vertical-align:1px;margin-left:4px;cursor:help;flex:none}
.info:hover,.info[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
#pop{position:fixed;z-index:95;max-width:300px;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#pop b{display:block;font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.03em;margin-bottom:3px}
#tip{position:fixed;z-index:96;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-family:var(--f-mono);font-size:11px;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* ---------- overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:880px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.kpi .vs{font-size:22px}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:12.5px;color:var(--ink3);display:flex;align-items:center}
.kpi .vs{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-family:var(--f-disp);font-weight:600;font-size:30px;line-height:1;flex-wrap:wrap;gap:2px 10px}
.kpi .vs .h{color:var(--home)} .kpi .vs .a{color:var(--away)}
.kpi .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:9px;background:var(--panel2)}
.kpi .bar i{display:block;height:100%}
.kpi .hint{font-size:12px;color:var(--ink2);margin-top:8px}
.insights{display:grid;gap:12px}
.ins{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--panel2);border-radius:10px;padding:14px 16px}
.ins .n{font-family:var(--f-disp);font-weight:600;font-size:30px;line-height:1;color:var(--accent)}
.ins b{display:block;font-size:16px;margin-bottom:4px}
.ins p{margin:0;color:var(--ink2);font-size:14.5px}
.tl{position:relative;height:116px;margin-top:2px}
.tl .axis{position:absolute;left:0;right:0;top:50%;height:4px;background:var(--line2);border-radius:2px}
.tl .ht{position:absolute;left:50%;top:22%;bottom:22%;width:2px;background:var(--line2)}
.tl .ev{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;display:grid;justify-items:center;gap:2px;color:var(--ink2)}
.tl .ev.up{bottom:52%} .tl .ev.dn{top:52%}
.tl .ev.up.ev2{bottom:52%;transform:translate(-50%,-22px)} .tl .ev.dn.ev2{transform:translate(-50%,22px)}
.tl .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--panel)}
.tl .dot.goal{background:var(--good)} .tl .dot.yc{background:#E6B800} .tl .dot.sub{background:var(--ink3)}
.tlx{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--ink3);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.sq{border-radius:2px}
.evlist{display:grid;gap:6px;font-size:13.5px}
.evlist .row{display:grid;grid-template-columns:44px 20px 1fr;gap:8px;align-items:center}
.evlist .m{font-family:var(--f-mono);color:var(--ink3)}
.evlist .ic{font-size:13px}

/* ---------- compare rows (stats) ---------- */
.cmp{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:12px;padding-block:9px;border-bottom:1px dashed var(--line)}
.cmp:last-child{border-bottom:none}
.cmp .v{font-family:var(--f-disp);font-weight:600;font-size:20px;text-align:right}
.cmp .v.a{text-align:left}
.cmp .v.h{color:var(--home)} .cmp .v.a{color:var(--away)}
.cmp .mid{display:grid;gap:5px}
.cmp .lbl{display:flex;justify-content:center;align-items:center;font-size:13.5px;color:var(--ink2);text-align:center}
.cmp .bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:7px}
.cmp .bars i{display:block;height:100%;border-radius:4px;background:var(--panel2);position:relative;overflow:hidden}
.cmp .bars i::after{content:"";position:absolute;top:0;bottom:0;width:var(--w);border-radius:4px}
.cmp .bars i.h::after{right:0;background:var(--home)} .cmp .bars i.a::after{left:0;background:var(--away)}
.cmp.win-h .v.h,.cmp.win-a .v.a{text-decoration:underline;text-decoration-color:currentColor;text-underline-offset:4px;text-decoration-thickness:2px}
.grouph{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:16px 0 4px}
.grouph:first-child{margin-top:0}
.halfseg{margin-left:auto}

/* ---------- charts ---------- */
.chart{width:100%}
.chartgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.mc{background:var(--panel2);border-radius:10px;padding:12px 12px 8px}
.mc h4{margin:0 0 6px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.mc .sub{font-size:12px;color:var(--ink3);margin:0 0 6px}

/* ---------- lineups ---------- */
.pitchbox{background:var(--pitch);border:1px solid var(--pitchline);border-radius:10px;padding:8px}
.roster{display:grid;gap:4px;font-size:13.5px}
.roster .r{display:grid;grid-template-columns:30px 36px 1fr auto;gap:8px;align-items:center;padding:4px 6px;border-radius:6px}
.roster .r:hover{background:var(--panel2)}
.roster .pos{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.roster .nm{display:inline-grid;place-items:center;width:28px;height:22px;border-radius:5px;font-family:var(--f-disp);font-weight:600;font-size:13px;color:#fff}
.roster .nm.h{background:var(--home)} .roster .nm.a{background:var(--away)}
.roster .ev{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);white-space:nowrap}
.roster .sub-h{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink3);margin:10px 0 2px;text-transform:uppercase}

/* ---------- players ---------- */
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th,.ptable td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase;font-weight:500;cursor:pointer;user-select:none}
.ptable th[aria-sort]{color:var(--accent)}
.ptable th:first-child,.ptable td:first-child,.ptable th:nth-child(2),.ptable td:nth-child(2){text-align:left}
.ptable tbody tr{cursor:pointer}
.ptable tbody tr:hover{background:var(--panel2)}
.ptable tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.ptable .nm{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:5px;font-family:var(--f-disp);font-weight:600;font-size:13px;color:#fff;background:var(--home);padding:0 5px}
.tscroll{overflow-x:auto}
.pcard .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.pcard .big{font-family:var(--f-disp);font-weight:600;font-size:46px;line-height:1;color:var(--home)}
.pcard .meta{font-size:13px;color:var(--ink2);line-height:1.6}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--panel2);border-radius:10px;padding:10px 12px}
.fact .k{font-size:12px;color:var(--ink3);display:flex;align-items:center}
.fact .v{font-family:var(--f-disp);font-weight:600;font-size:26px;line-height:1.1;margin-top:3px}
.fact .c{font-size:12px;color:var(--ink2);margin-top:3px}
.fact.best .v{color:var(--good)} .fact.worst .v{color:var(--serious)}
.callout{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;color:var(--ink2)}
.callout b{color:var(--ink)}

/* ---------- AI demo layer ---------- */
.demo-banner{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:var(--r);padding:12px 16px;font-size:14px;color:var(--ink2)}
.demo-banner b{color:var(--ink)}
.demo-tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;vertical-align:middle}
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav button{font-size:13.5px;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;color:var(--ink2);background:var(--panel)}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meter{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:12px;padding-block:7px}
.meter .lbl{font-size:14px;color:var(--ink2);display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.meter .track{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.meter .fill{height:100%;background:var(--accent);border-radius:4px}
.meter .val{font-family:var(--f-disp);font-weight:600;font-size:18px;text-align:right}
.chip{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--serious);border:1px solid color-mix(in srgb,var(--serious) 45%,transparent);padding:1px 6px;border-radius:999px}
.klist{display:grid;gap:8px}
.kitem{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;background:var(--panel2);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.kitem:hover{background:var(--accent-soft)}
.kitem .n{font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.kitem .t{font-weight:600;font-size:14px}
.kitem .d{font-size:13px;color:var(--ink2);margin-top:1px}
.kitem .go{font-family:var(--f-mono);font-size:11px;color:var(--accent);white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:5px 12px;color:var(--ink2);background:var(--panel)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .c{color:var(--ink3);font-family:var(--f-mono);font-size:11px} .fchip[aria-pressed="true"] .c{color:var(--bg);opacity:.7}
.sev{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sev.positive{color:var(--good)} .sev.minor{color:var(--ink3)} .sev.serious{color:var(--serious)} .sev.critical{color:var(--crit)}
.eplist{display:grid;gap:10px}
.ep{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ep summary{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;list-style:none}
.ep summary::-webkit-details-marker{display:none}
.ep summary:hover{background:var(--panel2)}
.ep .t{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.ep .ti{font-weight:600;font-size:14px}
.ep .cat{font-family:var(--f-mono);font-size:10px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.epbody{display:grid;grid-template-columns:1fr 240px;gap:16px;padding:4px 14px 16px;border-top:1px dashed var(--line)}
@media(max-width:760px){.epbody{grid-template-columns:1fr}}
.ecc{display:grid;gap:8px;margin-top:10px}
.ecc .row{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start}
.ecc .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;padding:3px 0}
.ecc .tag.e{color:var(--crit)} .ecc .tag.c{color:var(--warn)} .ecc .tag.q{color:var(--away)}
.ecc .tx{font-size:13.5px;color:var(--ink2)}
.snap{background:var(--pitch);border:1px solid var(--pitchline);border-radius:8px;padding:8px;align-self:start;margin-top:10px}
.eprow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.epbtn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:13px;border-radius:999px;padding:8px 15px}
.epbtn:hover{background:var(--accent2)}
.pitchwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pcap{min-height:52px;display:flex;align-items:center;gap:12px;margin-block:10px 8px}
.pcap .ph{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;padding:4px 9px;border-radius:4px;white-space:nowrap;color:#fff}
.pcap .ptx{font-size:14px}
.pctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pbtn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.pbtn:hover{background:var(--accent2)}
.pbtn.sec{background:var(--panel2);color:var(--ink2);border:1px solid var(--line2)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);height:26px}
.ptime{font-family:var(--f-mono);font-size:12px;color:var(--ink2);min-width:84px;text-align:right}
.phases{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.phases button{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;border:1px solid var(--line2);border-radius:6px;padding:5px 9px;color:var(--ink3)}
.phases button[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.rep{max-width:760px}
.rep h3{font-family:var(--f-disp);font-weight:600;font-size:19px;letter-spacing:.04em;margin:24px 0 8px;display:flex;align-items:baseline;gap:10px}
.rep h3 .n{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.rep p{color:var(--ink2);margin:8px 0}
.rep .lead{color:var(--ink);font-size:16px}
.drill{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--panel2);border-radius:10px;padding:12px;margin-top:10px}
@media(max-width:560px){.drill{grid-template-columns:1fr}}
.drill b{font-size:14px}
.drill .dm{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);margin-top:3px}
.chat{display:flex;flex-direction:column;gap:12px;min-height:300px}
.msgs{display:grid;gap:10px}
.msg{max-width:92%;border-radius:12px;padding:10px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{background:var(--accent-soft);justify-self:end}
.msg.a{background:var(--panel2);justify-self:start}
.msg.a .src{display:block;margin-top:8px;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:7px 13px;color:var(--ink2);text-align:left;background:var(--panel)}
.sugg button:hover{border-color:var(--accent);color:var(--ink)}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:11px 16px;color:var(--ink);font:inherit;min-width:0}
.askrow input::placeholder{color:var(--ink3)}
.send{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 18px;font-weight:600;flex:none}
.send:hover{background:var(--accent2)} .send[disabled]{opacity:.45;cursor:default}
.ainote{font-size:12.5px;color:var(--ink3)}

<script>
/* ===================== helpers ===================== */
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const fmt = n => (typeof n==="number" && !Number.isInteger(n)) ? n.toFixed(1).replace(".",LANG==="ru"?",":".") : String(n);
const HN = () => L(M.home.name), AN = () => L(M.away.name);

/* tooltip (hover) */
const tip = document.createElement("div"); tip.id="tip"; tip.hidden=true; document.body.appendChild(tip);
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("pointerenter",e=>{tip.textContent=el.dataset.tip;tip.hidden=false;moveTip(e)});
    el.addEventListener("pointermove",moveTip);
    el.addEventListener("pointerleave",()=>tip.hidden=true);
  });
}
function moveTip(e){
  const pad=14,w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth-8)x=e.clientX-w-pad; if(y+h>innerHeight-8)y=e.clientY-h-pad;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
/* glossary popover (click or hover on .info) */
const pop = document.createElement("div"); pop.id="pop"; pop.hidden=true; document.body.appendChild(pop);
let popOwner=null;
function showPop(el){
  const g=G[el.dataset.g]; if(!g)return;
  pop.innerHTML=`<b>${esc(L(g.t))}</b>${esc(L(g.d))}`; pop.hidden=false; popOwner=el; el.setAttribute("aria-expanded","true");
  const r=el.getBoundingClientRect(); let x=r.left, y=r.bottom+8;
  if(x+pop.offsetWidth>innerWidth-10)x=innerWidth-10-pop.offsetWidth; if(y+pop.offsetHeight>innerHeight-10)y=r.top-pop.offsetHeight-8;
  pop.style.left=Math.max(8,x)+"px"; pop.style.top=Math.max(8,y)+"px";
}
function hidePop(){ pop.hidden=true; if(popOwner)popOwner.setAttribute("aria-expanded","false"); popOwner=null }
document.addEventListener("click",e=>{
  const el=e.target.closest(".info");
  if(el){ e.stopPropagation(); if(popOwner===el)hidePop(); else showPop(el); return }
  if(!e.target.closest("#pop"))hidePop();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hidePop()});
document.addEventListener("pointerover",e=>{const el=e.target.closest(".info"); if(el&&popOwner!==el&&matchMedia("(hover:hover)").matches)showPop(el)});
document.addEventListener("pointerout",e=>{const el=e.target.closest(".info"); if(el&&popOwner===el&&matchMedia("(hover:hover)").matches&&!e.relatedTarget?.closest?.("#pop"))hidePop()});
const info = g => G[g] ? `<span class="info" tabindex="0" data-g="${g}" aria-expanded="false" aria-label="${esc(L(G[g].t))}">i</span>` : "";

/* ===================== generic charts (SVG) ===================== */
function lineChart(labels, home, away, opt={}){
  const w=520,h=200,padL=34,padR=14,padT=14,padB=30;
  const max=opt.max ?? Math.max(1,...home,...away)*1.15;
  const X=i=>padL+i*(w-padL-padR)/(labels.length-1), Y=v=>padT+(h-padT-padB)*(1-v/max);
  const path=s=>s.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const ticks=4; let grid="";
  for(let k=0;k<=ticks;k++){const v=max*k/ticks,y=Y(v);grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)"/><text x="${padL-6}" y="${y+3.5}" font-size="10" fill="var(--ink3)" text-anchor="end">${Math.round(v)}${opt.unit||""}</text>`}
  const xl=labels.map((l,i)=>`<text x="${X(i)}" y="${h-10}" font-size="10" fill="var(--ink3)" text-anchor="middle">${l}</text>`).join("");
  const dots=(s,c,tn)=>s.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${c}" stroke="var(--panel)" stroke-width="1.5" data-tip="${labels[i]}' · ${tn}: ${v}${opt.unit||""}"/>`).join("");
  const endLab=(s,c,dy)=>`<text x="${X(s.length-1)+8}" y="${Y(s[s.length-1])+dy}" font-size="11" font-weight="500" fill="${c}">${s[s.length-1]}${opt.unit||""}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${grid}${xl}
    <path d="${path(home)}" fill="none" stroke="var(--home)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="${path(away)}" fill="none" stroke="var(--away)" stroke-width="2.2" stroke-linejoin="round"/>
    ${dots(home,"var(--home)",M.home.short)}${dots(away,"var(--away)",M.away.short)}
    ${endLab(home,"var(--home)",home[home.length-1]>=away[away.length-1]?-6:12)}${endLab(away,"var(--away)",home[home.length-1]>=away[away.length-1]?12:-6)}</svg>`;
}
function groupedBars(labels, home, away, opt={}){
  const w=520,h=200,padL=30,padR=10,padT=14,padB=30;
  const max=opt.max ?? Math.max(1,...home,...away)*1.15;
  const n=labels.length, slot=(w-padL-padR)/n, bw=Math.min(26,slot*0.32);
  const Y=v=>padT+(h-padT-padB)*(1-v/max), y0=Y(0);
  let grid=""; for(let k=0;k<=4;k++){const v=max*k/4,y=Y(v);grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)"/><text x="${padL-6}" y="${y+3.5}" font-size="10" fill="var(--ink3)" text-anchor="end">${Math.round(v)}</text>`}
  let bars=""; labels.forEach((l,i)=>{
    const cx=padL+slot*(i+0.5);
    const hh=Math.max(1,y0-Y(home[i])), ah=Math.max(1,y0-Y(away[i]));
    bars+=`<rect x="${cx-bw-1.5}" y="${y0-hh}" width="${bw}" height="${hh}" rx="3" fill="var(--home)" data-tip="${l}' · ${M.home.short}: ${home[i]}"/>
           <rect x="${cx+1.5}" y="${y0-ah}" width="${bw}" height="${ah}" rx="3" fill="var(--away)" data-tip="${l}' · ${M.away.short}: ${away[i]}"/>
           <text x="${cx-bw/2-1.5}" y="${y0-hh-4}" font-size="10" fill="var(--ink2)" text-anchor="middle">${home[i]}</text>
           <text x="${cx+bw/2+1.5}" y="${y0-ah-4}" font-size="10" fill="var(--ink2)" text-anchor="middle">${away[i]}</text>
           <text x="${cx}" y="${h-10}" font-size="10" fill="var(--ink3)" text-anchor="middle">${l}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${grid}<line x1="${padL}" y1="${y0}" x2="${w-padR}" y2="${y0}" stroke="var(--line2)"/>${bars}</svg>`;
}
const legendTeams = () => `<span><i style="background:var(--home)"></i>${HN()}</span><span><i style="background:var(--away)"></i>${AN()}</span>`;

/* compare row (home value | label | away value) */
function cmpRow(label, hv, av, opt={}){
  const inv=!!opt.inv, hNum=opt.hn??hv, aNum=opt.an??av;
  const tot=Math.max(1,Math.abs(hNum)+Math.abs(aNum));
  let win=""; if(!opt.neutral && hNum!==aNum){ win = (inv ? hNum<aNum : hNum>aNum) ? "win-h" : "win-a" }
  const hw=opt.pct?hNum:100*hNum/tot, aw=opt.pct?aNum:100*aNum/tot;
  return `<div class="cmp ${win}"><span class="v h num">${hv}</span>
    <div class="mid"><div class="lbl">${label}${opt.g?info(opt.g):""}</div>
      <div class="bars"><i class="h" style="--w:${hw}%"></i><i class="a" style="--w:${aw}%"></i></div></div>
    <span class="v a num">${av}</span></div>`;
}

<script>
/* ===================== line-ups ===================== */
"use strict";
function pitchV(w=340,h=440){ /* vertical pitch, attacking upward; returns {svgOpen, svgClose, X, Y} */
  const X=x=>18+(x/100)*(w-36), Y=y=>h-18-(y/100)*(h-36); /* x = width 0..100, y = length 0..100 (0 = own goal) */
  const open=`<svg viewBox="0 0 ${w} ${h}" role="img" style="width:100%;height:auto">
    <rect x="1" y="1" width="${w-2}" height="${h-2}" rx="6" fill="none" stroke="var(--pitchline)"/>
    <line x1="18" y1="${h/2}" x2="${w-18}" y2="${h/2}" stroke="var(--pitchline)"/>
    <circle cx="${w/2}" cy="${h/2}" r="${(h-36)*0.087}" fill="none" stroke="var(--pitchline)"/>
    <rect x="${X(21)}" y="${Y(16.5)}" width="${X(79)-X(21)}" height="${Y(0)-Y(16.5)}" fill="none" stroke="var(--pitchline)"/>
    <rect x="${X(21)}" y="${Y(100)}" width="${X(79)-X(21)}" height="${Y(83.5)-Y(100)}" fill="none" stroke="var(--pitchline)"/>
    <rect x="${X(37)}" y="${Y(5.5)}" width="${X(63)-X(37)}" height="${Y(0)-Y(5.5)}" fill="none" stroke="var(--pitchline)"/>
    <rect x="${X(37)}" y="${Y(100)}" width="${X(63)-X(37)}" height="${Y(94.5)-Y(100)}" fill="none" stroke="var(--pitchline)"/>`;
  return {open, close:"</svg>", X, Y};
}
function renderLineups(){
  $("#lu-h").textContent=HN(); $("#lu-a").textContent=AN();
  const ru=LANG==="ru";
  [["h",M.lineup.home,"home"],["a",M.lineup.away,"away"]].forEach(([side,list,team])=>{
    const p=pitchV();
    const dots=list.map(pl=>{
      const r=pl.start?9+Math.round(6*pl.min/100):7+Math.round(5*pl.min/100), op=pl.start?1:0.68;
      return `<g data-tip="${esc(pl.name)} · ${pl.pos} · ${pl.min} ${ru?"мин":"min"}"><circle cx="${p.X(pl.y)}" cy="${p.Y(pl.x)}" r="${r}" fill="var(--${team})" opacity="${op}" stroke="var(--pitch)" stroke-width="1.5"/><text x="${p.X(pl.y)}" y="${p.Y(pl.x)+4}" text-anchor="middle" font-size="${r>12?11:10}" font-weight="600" fill="var(--pitchdot-ink)">${pl.num}</text></g>`;

    const row=pl=>`<div class="r"><span class="pos">${pl.pos}</span><span class="nm ${side}">${pl.num}</span><span>${esc(pl.name)}</span><span class="ev num">${ev(pl)} · ${pl.min}'</span></div>`;

    cmpRow(ru?"Вперёд":"Forward",P.fwd[0],P.fwd[1])+
    cmpRow(ru?"В сторону":"Sideways",P.side[0],P.side[1])+
    cmpRow(ru?"Назад":"Backward",P.back[0],P.back[1],{inv:true})+
    cmpRow(ru?"С игры":"From open play",P.openPlay[0],P.openPlay[1])+
    cmpRow(ru?"Со стандартов":"From set pieces",P.setPiece[0],P.setPiece[1])+
    `<p class="footnote">${ru?"У Таджикистана половина передач — в сторону (303 из 614), вперёд — 32%. У Индии вперёд шло 54% передач: игра длиннее и прямее.":"Half of Tajikistan's passes went sideways (303 of 614), 32% forward. India played 54% of passes forward: a longer, more direct game."}</p>`;
  /* network */
  const p=pitchV(340,440), N=M.network, pos={}; M.lineup.home.forEach(pl=>pos[pl.num]=pl);
  const maxMade=Math.max(...Object.values(N.made));
  const edges=N.edges.filter(e=>e[2]>=5).map(e=>{const a=pos[e[0]],b=pos[e[1]]; if(!a||!b)return"";
    return `<line x1="${p.X(a.y)}" y1="${p.Y(a.x)}" x2="${p.X(b.y)}" y2="${p.Y(b.x)}" stroke="var(--home)" stroke-opacity="${0.25+0.5*(e[2]-5)/11}" stroke-width="${1+(e[2]-5)*0.45}" stroke-linecap="round" data-tip="${a.num} → ${b.num}: ${e[2]} ${ru?"передач":"passes"}"/>`}).join("");
  const nodes=N.nodes.map(n=>{const pl=pos[n]; if(!pl)return""; const r=7+10*Math.sqrt((N.made[n]||0)/maxMade);
    return `<g data-tip="${esc(pl.name)} · ${ru?"отдал":"made"} ${N.made[n]||0} · ${ru?"получил":"received"} ${N.received[n]||0}"><circle cx="${p.X(pl.y)}" cy="${p.Y(pl.x)}" r="${r}" fill="var(--home)" stroke="var(--panel)" stroke-width="1.5" opacity="${pl.start?1:0.72}"/><text x="${p.X(pl.y)}" y="${p.Y(pl.x)+3.5}" text-anchor="middle" font-size="${r>13?11:9.5}" font-weight="600" fill="var(--pitchdot-ink)">${n}</text></g>`}).join("");

    cmpRow(ru?"Отборы удачные":"Tackles won",`${D.tackles[0][1]}/${D.tackles[0][0]}`,`${D.tackles[1][1]}/${D.tackles[1][0]}`,{hn:D.tackles[0][1],an:D.tackles[1][1],g:"tackles"})+

  $("#passflow").innerHTML=lineChart(M.periods.labels,M.periods.passes.home,M.periods.passes.away)+`<div class="legend">${legendTeams()}</div>`;

/* ===================== players ===================== */
let SORT={k:"min",dir:-1}, SELP=2;
function playerRows(){
  return M.lineup.home.map(pl=>{const s=M.players[pl.num]||{}; const p=s.p||[0,0], d=s.d||[0,0], ttd=s.ttd||[0,0], prog=s.prog||[0,0], sh=s.shots||[0,0];
    return {num:pl.num,name:pl.name,pos:pl.pos,min:pl.min,ttd:ttd[0],ttdp:pct(ttd[1],ttd[0]),pass:p[0],passc:p[1],passp:pct(p[1],p[0]),prog:prog[1],progt:prog[0],duel:d[0],duelw:d[1],duelp:pct(d[1],d[0]),loss:s.losses??0,shots:sh[0],shotsOn:sh[1],gk:!!s.gk,s};
  });
}
function renderPlayers(){
  const rows=playerRows().sort((a,b)=>(a[SORT.k]-b[SORT.k])*SORT.dir || a.num-b.num);
  const cols=[["num","num"],["name","name"],["pos","pos"],["min","min"],["ttd","ttd"],["ttdp","ttdp"],["pass","pass"],["passp","passp"],["prog","prog"],["duel","duel"],["duelp","duelp"],["loss","loss"],["shots","shots"]];
  const th=cols.map(([k,l])=>`<th data-k="${k}" ${SORT.k===k?`aria-sort="${SORT.dir<0?"descending":"ascending"}"`:""}>${L(STR.th[l])}${SORT.k===k?(SORT.dir<0?" ▾":" ▴"):""}</th>`).join("");
  const td=r=>`<tr data-num="${r.num}" aria-selected="${r.num===SELP}"><td><span class="nm">${r.num}</span></td><td>${esc(r.name)}</td><td style="color:var(--ink3)">${r.pos}</td><td class="num">${r.min}</td>
    <td class="num">${r.gk?"—":`${r.ttd}`}</td><td class="num">${r.gk?"—":r.ttdp+"%"}</td><td class="num">${r.pass}/${r.passc}</td><td class="num">${r.passp}%</td><td class="num">${r.gk?"—":`${r.prog}/${r.progt}`}</td><td class="num">${r.gk?"—":`${r.duelw}/${r.duel}`}</td><td class="num">${r.gk?"—":(r.duel?r.duelp+"%":"—")}</td><td class="num">${r.loss}</td><td class="num">${r.gk?"—":`${r.shots}/${r.shotsOn}`}</td></tr>`;
  $("#ptable").innerHTML=`<thead><tr>${th}</tr></thead><tbody>${rows.map(td).join("")}</tbody>`;
  $("#ptable").querySelectorAll("th").forEach(h=>h.onclick=()=>{const k=h.dataset.k; if(k==="name"||k==="pos")return; if(SORT.k===k)SORT.dir*=-1; else SORT={k,dir:-1}; renderPlayers()});
  $("#ptable").querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>{SELP=+tr.dataset.num;renderPlayers();renderPlayerCard()});
}
function teamAvg(fn){ const rs=playerRows().filter(r=>!r.gk&&r.min>0); return rs.reduce((a,r)=>a+fn(r),0)/rs.length }
function renderPlayerCard(){
  const r=playerRows().find(x=>x.num===SELP), pl=M.lineup.home.find(x=>x.num===SELP), s=M.players[SELP]||{}, ru=LANG==="ru";
  if(!r)return;
  const rows=playerRows().filter(x=>!x.gk&&x.min>0);
  const best=(k,desc=true)=>{const v=r[k]; return desc ? rows.every(x=>x[k]<=v) : rows.every(x=>x[k]>=v)};
  const per90=(v)=>r.min?Math.round(v*90/r.min*10)/10:0;
  const fact=(k,v,c,cls="")=>`<div class="fact ${cls}"><div class="k">${k}</div><div class="v num">${v}</div><div class="c">${c}</div></div>`;
  let facts="";
  if(r.gk){ facts=fact(ru?"Ударов по воротам":"Shots faced",s.gk.faced,`${ru?"в створ":"on target"} ${s.gk.onT}`)+fact(ru?"Сейвы":"Saves",s.gk.saves,`${ru?"пропущено":"conceded"} ${s.gk.conceded}`)+fact(ru?"Передачи":"Passes",`${r.pass}/${r.passc}`,`${r.passp}% ${ru?"точность":"accuracy"}`)+fact(ru?"Длинные передачи":"Long passes",`${s.long[1]}/${s.long[0]}`,ru?"дошли / всего":"completed / total"); }
  else {
    facts=fact(`${ru?"Действий с мячом":"Actions"}${info("ttd")}`,r.ttd,`${r.ttdp}% ${ru?"удачных":"successful"} · ${t("pcTeamAvg")} ${Math.round(teamAvg(x=>x.ttdp))}%`,best("ttd")?"best":"")
      +fact(`${ru?"Передачи":"Passes"}${info("passAcc")}`,`${r.passc}/${r.pass}`,`${r.passp}% · ${t("pcTeamAvg")} ${Math.round(teamAvg(x=>x.passp))}%`,best("passc")?"best":"")
      +fact(`${ru?"Прогрессивные":"Progressive"}${info("progPass")}`,`${r.prog}/${r.progt}`,`${ru?"дошли / всего":"completed / total"}`,best("prog")?"best":"")
      +fact(`${ru?"Единоборства":"Duels"}${info("duels")}`,`${r.duelw}/${r.duel}`,`${r.duel?r.duelp+"%":"—"} · ${t("pcTeamAvg")} ${Math.round(teamAvg(x=>x.duel?x.duelp:0))}%`,r.duel>=3&&best("duelp")?"best":"")
      +fact(`${ru?"Потери":"Losses"}${info("losses")}`,r.loss,`${per90(r.loss)} ${ru?"за 90 мин":"per 90 min"}`,best("loss",true)&&r.min>30?"worst":"")
      +fact(`${ru?"Удары":"Shots"}${info("shots")}`,`${r.shots}/${r.shotsOn}`,`${ru?"всего / в створ":"total / on target"}${s.goals?` · ${ru?"гол":"goal"} ${s.goals}`:""}`,s.goals?"best":"");
    if(s.key&&s.key[0])facts+=fact(`${ru?"Ключевые передачи":"Key passes"}${info("keyPass")}`,`${s.key[1]}/${s.key[0]}`,ru?"дошли / всего":"completed / total");
    if(s.intoBox&&s.intoBox[0])facts+=fact(`${ru?"В штрафную":"Into the box"}${info("intoBox")}`,`${s.intoBox[1]}/${s.intoBox[0]}`,ru?"дошли / всего":"completed / total");
    if(s.cross&&s.cross[0])facts+=fact(`${ru?"Подачи":"Crosses"}${info("crosses")}`,`${s.cross[1]}/${s.cross[0]}`,ru?"точные / всего":"accurate / total");
    if(s.interceptions)facts+=fact(`${ru?"Перехваты":"Interceptions"}${info("interceptions")}`,s.interceptions,"");
    if(s.tackles)facts+=fact(`${ru?"Отборы":"Tackles"}${info("tackles")}`,s.tackles,"");
  }
  const evs=[pl.goal?`● ${pl.goal}'`:"",pl.yc?`■ ${pl.yc}'`:"",pl.in?`↑ ${pl.in}'`:"",pl.out?`↓ ${pl.out}'`:""].filter(Boolean).join("  ");
  $("#playercard").innerHTML=`<div class="card pcard">
    <div class="head"><span class="big num">${pl.num}</span><div><div style="font-family:var(--f-disp);font-weight:600;font-size:24px">${esc(pl.name)}</div><div class="meta">${pl.pos} · ${pl.min} ${t("minutes")} ${evs?"· "+evs:""}</div></div></div>
    <div class="facts">${facts}</div>
    ${s.note?`<div class="callout" style="margin-top:14px">${esc(L(s.note))}</div>`:""}
    <div class="callout" style="margin-top:14px"><b>${ru?"Дальше":"Next"}:</b> ${t("pcNote")}</div>
  </div>`;
}

<script>

"use strict";

    <rect x="1" y="${sy(14)}" width="${(w-8)*16.5/105}" height="${sy(54)-sy(14)}" fill="none" stroke="var(--pitchline)"/><rect x="${w-1-(w-8)*16.5/105}" y="${sy(14)}" width="${(w-8)*16.5/105}" height="${sy(54)-sy(14)}" fill="none" stroke="var(--pitchline)"/>`;

}

    <div class="epbody"><div><div class="ecc">
      <div class="row"><span class="tag e">■ ${t("err")}</span><span class="tx">${esc(L(e.e))}</span></div>
      <div class="row"><span class="tag c">■ ${t("cause")}</span><span class="tx">${esc(L(e.c))}</span></div>
      <div class="row"><span class="tag q">■ ${t("cons")}</span><span class="tx">${esc(L(e.q))}</span></div></div>
      <div class="eprow">${e.replay?`<button class="epbtn" data-replay="1">▶ ${t("openReplay")}</button>`:""}${typeof watchBtn==="function"?watchBtn(e.min):""}${e.replay?"":`<span class="footnote">▸ ${t("clips")}</span>`}</div></div>

  if(typeof bindWatch==="function")bindWatch($("#eplist"));

/* ---- 2D replay (illustrative) ---- */
const KEYS={
  T1:[[0,[5,34]],[8,[5,34]],[11,[4,33]],[14,[3.5,31]]],
  T2:[[0,[24,13]],[4,[24,13.5]],[8,[23,14]],[11,[19,18]],[14,[13,24]]],
  T5:[[0,[24,27]],[3,[24.5,27.5]],[4.5,[29,28.5]],[6.5,[31.4,28.5]],[9.5,[31.4,28.5]],[11,[26,30]],[14,[18,33]]],

  T3:[[0,[24,55]],[4,[24,55]],[8,[23,55]],[11,[20,53]],[14,[14,49]]],
  T6:[[0,[33,36]],[4,[33,36]],[8,[32,37]],[11,[28,38]],[14,[21,40]]],
  T8:[[0,[37,25]],[4,[37,25.5]],[8,[36.5,26]],[9.5,[35,27]],[11,[30,29]],[14,[23,31]]],
  T11:[[0,[48,58]],[8,[47,58]],[14,[38,55]]],
  U14:[[0,[44,30]],[2,[42,29]],[4,[40,29]],[8,[39.5,29.5]],[9.5,[39,30]],[14,[36,30]]],
  U10:[[0,[36,26]],[3,[34.5,29]],[4.5,[33,31.5]],[6.5,[32.5,32]],[9.5,[32,32]],[14,[29,33]]],
  U9:[[0,[28,40]],[6.5,[27.5,38]],[9.5,[26,34]],[11,[17,31]],[12.5,[11,31]],[14,[9,33]]],
  U7:[[0,[40,54]],[8,[38,52]],[11,[28,48]],[14,[14,43]]],
  BALL:[[0,[44,30]],[2,[42,29]],[4,[40,29]],[8,[39.5,29.5]],[9.7,[39,30]],[11.4,[13,31]],[12.6,[10,33]],[13.4,[13,40]],[14,[15,42]]]
};
const PHASES=[[0,3.5],[3.5,6.5],[6.5,9.5],[9.5,12],[12,14]], PHC=["var(--ink3)","var(--crit)","var(--warn)","var(--away)","var(--crit)"], DUR=14;
function lerpTrack(tr,tm){ if(tm<=tr[0][0])return tr[0][1]; for(let i=1;i<tr.length;i++){ if(tm<=tr[i][0]){const[t0,p0]=tr[i-1],[t1,p1]=tr[i],k=(tm-t0)/(t1-t0);return[p0[0]+(p1[0]-p0[0])*k,p0[1]+(p1[1]-p0[1])*k]} } return tr[tr.length-1][1] }
let PT=0, playing=false, raf=null, last=0, SX=null, SY=null;
function buildPitch(){
  const w=760,h=500, sx=v=>30+v*(w-60)/105, sy=v=>14+v*(h-28)/68; SX=sx; SY=sy;
  $("#pitchbox").innerHTML=`<svg id="psvg" viewBox="0 0 ${w} ${h}" role="img" style="width:100%;height:auto">
    <rect x="${sx(0)}" y="${sy(0)}" width="${sx(105)-sx(0)}" height="${sy(68)-sy(0)}" rx="6" fill="var(--pitch)" stroke="var(--pitchline)"/>
    <line x1="${sx(52.5)}" y1="${sy(0)}" x2="${sx(52.5)}" y2="${sy(68)}" stroke="var(--pitchline)"/><circle cx="${sx(52.5)}" cy="${sy(34)}" r="${sy(43.15)-sy(34)}" fill="none" stroke="var(--pitchline)"/>
    <rect x="${sx(0)}" y="${sy(13.85)}" width="${sx(16.5)-sx(0)}" height="${sy(54.15)-sy(13.85)}" fill="none" stroke="var(--pitchline)"/><rect x="${sx(105-16.5)}" y="${sy(13.85)}" width="${sx(16.5)-sx(0)}" height="${sy(54.15)-sy(13.85)}" fill="none" stroke="var(--pitchline)"/>
    <rect id="zone" x="${sx(16)}" y="${sy(24)}" width="${sx(30)-sx(16)}" height="${sy(37)-sy(24)}" rx="4" fill="rgba(198,40,40,.14)" stroke="var(--crit)" stroke-dasharray="5 4" opacity="0"/>
    <line id="dline" x1="0" y1="0" x2="0" y2="0" stroke="var(--crit)" stroke-width="1.6" stroke-dasharray="4 3" opacity="0"/><text id="dlab" x="0" y="0" font-size="12" fill="var(--crit)" opacity="0">7.4 m</text>
    <line id="passline" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="6 4" opacity="0"/><g id="actors"></g></svg>`;
  const g=$("#actors"); let html="";
  Object.keys(KEYS).forEach(id=>{ if(id==="BALL"){html+=`<circle id="a-BALL" r="5" fill="#F6F3E7" stroke="#0B0E11" stroke-width="1.4"/>`;return}
    const home=id[0]==="T"; html+=`<g id="a-${id}"><circle r="12" fill="${home?"var(--home)":"var(--away)"}" stroke="var(--panel)" stroke-width="1.6"/><text y="3.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#fff">${L(ROLE[id])}</text></g>`; });

  $("#plegend").innerHTML=`<span><i style="background:var(--home)"></i>${t("pl_home")}</span><span><i style="background:var(--away)"></i>${t("pl_away")}</span><span><i style="background:#F6F3E7;border:1px solid var(--line2)"></i>${t("pl_ball")}</span><span><i style="background:rgba(198,40,40,.4)"></i>${t("pl_zone")}</span>`;
  $("#phasebtns").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" aria-pressed="false">${i+1} · ${L(STR.phase[i])}</button>`).join("");

}
function phaseAt(tm){ for(let i=PHASES.length-1;i>=0;i--) if(tm>=PHASES[i][0]) return i; return 0 }
function setT(tm){
  PT=Math.max(0,Math.min(DUR,tm)); if(!SX)return;
  Object.entries(KEYS).forEach(([id,tr])=>{const[x,y]=lerpTrack(tr,PT),el=document.getElementById("a-"+id); if(!el)return; if(id==="BALL"){el.setAttribute("cx",SX(x));el.setAttribute("cy",SY(y))} else el.setAttribute("transform",`translate(${SX(x)},${SY(y)})`)});

<script>
/* ===================== match video: link or local file → player → jump to moments =====================
   Sources: YouTube (official IFrame API: exact seek, error detection), Vimeo / Rutube (embed, reload-to-seek),
   Google Drive / any iframe (embed only), direct .mp4/.webm/.m3u8 links, and a LOCAL FILE from this computer
   (works with no internet; exact seek). Inside the claude.ai viewer third-party frames are blocked → link-out. */
"use strict";
const SANDBOX = !!(window.claude && window.claude.use);
const FILEPAGE = location.protocol === "file:";          /* opened from disk: no referrer → YouTube embeds may refuse (error 153) */
const VID = {url:"", kind:null, id:null, hls:false, h1:0, h2:null, name:"", failed:null};
let LASTNAME="";                                          /* file chosen last time (blob: urls do not survive a reload) */
try{
  const s=JSON.parse(localStorage.getItem("fal2-video")||"null");
  if(s){ VID.h1=s.h1||0; VID.h2=(s.h2==null?null:s.h2); LASTNAME=s.name||"";
    if(s.url){ const p=parseVideo(s.url); if(p) Object.assign(VID,p) } }
}catch(e){}

function parseVideo(url){
  url=(url||"").trim(); if(!url)return null;
  let m;
  if((m=url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/))) return {url,kind:"youtube",id:m[1],hls:false};
  if((m=url.match(/vimeo\.com\/(?:video\/)?(\d{6,})/))) return {url,kind:"vimeo",id:m[1],hls:false};
  if((m=url.match(/rutube\.ru\/(?:video|play\/embed)\/([A-Za-z0-9]{10,})/))) return {url,kind:"rutube",id:m[1],hls:false};
  if((m=url.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{10,})/))) return {url,kind:"gdrive",id:m[1],hls:false};
  if(/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url)) return {url,kind:"file",id:url,hls:false};
  if(/\.m3u8(\?|#|$)/i.test(url)) return {url,kind:"file",id:url,hls:true};
  if(/^https?:\/\//i.test(url)) return {url,kind:"iframe",id:url,hls:false};
  return null;
}
const mmss = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0") };
const parseMMSS = v => { v=(v||"").trim(); if(!v)return null; const p=v.split(":").map(Number); if(p.some(isNaN))return null; return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0] };
/* a hosted link can carry the video: index.html?v=<link or YouTube id>&h1=mm:ss&h2=mm:ss#video */
try{
  const q=new URLSearchParams(location.search), qv=(q.get("v")||"").trim();
  if(qv){ const raw=/^[A-Za-z0-9_-]{6,}$/.test(qv) ? "https://www.youtube.com/watch?v="+qv : qv, p=parseVideo(raw);
    if(p){ Object.assign(VID,p,{name:"",failed:null}); const h1=parseMMSS(q.get("h1")||""), h2=parseMMSS(q.get("h2")||""); if(h1!=null)VID.h1=h1; if(h2!=null)VID.h2=h2; } }
}catch(e){}
function shareLink(){ /* link to this page with the video pre-connected (hosted pages only) */
  if(!VID.kind || VID.kind==="local" || !/^https?:/.test(location.protocol)) return "";
  const u=new URL(location.href), p=new URLSearchParams();
  p.set("v", VID.kind==="youtube" ? VID.id : VID.url); if(VID.h1) p.set("h1", mmss(VID.h1)); if(VID.h2!=null) p.set("h2", mmss(VID.h2));
  u.search=p.toString(); u.hash="video"; return u.toString();
}
async function copyShare(btn){
  const link=shareLink(); if(!link) return;
  try{ await navigator.clipboard.writeText(link); btn.textContent="✓ "+t("vidShared"); setTimeout(()=>{btn.textContent=t("vidShare")},2500) }
  catch(e){ const box=$("#vidshareout"); if(box){ box.hidden=false; box.value=link; box.select() } }
}
function toSec(min){ /* match minute → seconds in the video, 8 s pre-roll */
  const h2 = VID.h2==null ? VID.h1 + 62*60 : VID.h2;
  const s = min>45.99 ? h2 + (min-45)*60 : VID.h1 + min*60;
  return Math.max(0, Math.round(s)-8);
}
function embedSrc(sec){
  const s=sec||0;
  switch(VID.kind){
    case "vimeo": return `https://player.vimeo.com/video/${VID.id}?autoplay=${s?1:0}#t=${s}s`;
    case "rutube": return `https://rutube.ru/play/embed/${VID.id}?t=${s}${s?"&autoplay=1":""}`;
    case "gdrive": return `https://drive.google.com/file/d/${VID.id}/preview`;
    default: return VID.url;
  }
}

    case "rutube": return `https://rutube.ru/video/${VID.id}/?t=${s}`;
    case "file": return VID.url.split("#")[0]+`#t=${s}`;
    case "local": return "";
    default: return VID.url;
  }
}
const canSeek  = () => ["youtube","vimeo","rutube","file","local"].includes(VID.kind);
const linkMode = () => VID.kind!=="local" && (SANDBOX || !!VID.failed || !canSeek());   /* moments open the source in a new tab */

/* ---------- YouTube IFrame API ---------- */
let YTP=null, ytReady=null, PENDING_SEC=null;
function loadYT(){
  if(window.YT && YT.Player) return Promise.resolve();
  if(ytReady) return ytReady;
  ytReady=new Promise((res,rej)=>{
    if(navigator.onLine===false){ rej("offline"); return }
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{ try{prev&&prev()}catch(e){} res() };
    const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; sc.async=true;
    sc.onerror=()=>rej(navigator.onLine===false?"offline":"api");
    document.head.appendChild(sc);
    setTimeout(()=>rej(navigator.onLine===false?"offline":"api"),12000);
  });
  ytReady.catch(()=>{ ytReady=null });   /* allow a retry later (network may come back) */
  return ytReady;
}
function killYT(){ if(YTP){ try{YTP.destroy()}catch(e){} YTP=null } PENDING_SEC=null }

/* ---------- player ---------- */
let hlsLoading=false, LAST_SEC=0, RENDER_SEQ=0;
function renderPlayer(sec){
  const box=$("#player"); if(!box)return;
  sec=sec||0; LAST_SEC=sec; killYT(); const seq=++RENDER_SEQ;
  if(!VID.kind){ box.innerHTML=`<div class="ph">${t("vidPh")}</div>`; return }
  if(VID.failed && VID.kind==="youtube"){ renderFail(VID.failed, sec); return }   /* stays failed until reconnected; files are retried */
  if(SANDBOX && VID.kind!=="local"){
    box.innerHTML=`<div class="ph" style="gap:12px;display:grid;align-content:center;justify-items:center"><span>${t("vidLinkOnly")}</span><a class="epbtn" href="${esc(linkOut(sec))}" target="_blank" rel="noopener">▶ ${t("vidOpen")}${sec?" · "+mmss(sec):""}</a></div>`; return;
  }
  if(VID.kind==="local" || VID.kind==="file"){
    box.innerHTML=`<video id="videl" controls playsinline preload="metadata"></video>`;
    const v=$("#videl");
    VID.failed=null;
    v.addEventListener("error",()=>{ if((VID.kind==="local"||VID.kind==="file") && seq===RENDER_SEQ){ VID.failed="local"; renderFail("local",sec); renderStatus(); renderMoments() } });
    const jump=()=>{ if(sec){ v.currentTime=sec; v.play().catch(()=>{}) } };
    if(VID.hls && !v.canPlayType("application/vnd.apple.mpegurl")){
      const attach=()=>{ if(window.Hls&&Hls.isSupported()){ const h=new Hls(); h.loadSource(VID.url); h.attachMedia(v); h.on(Hls.Events.MANIFEST_PARSED,jump) } else { v.src=VID.url; v.addEventListener("loadedmetadata",jump,{once:true}) } };
      if(window.Hls)attach(); else if(!hlsLoading){ hlsLoading=true; const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"; sc.onload=attach; sc.onerror=()=>{hlsLoading=false; v.src=VID.url}; document.head.appendChild(sc) }
    } else { v.src=VID.url; v.addEventListener("loadedmetadata",jump,{once:true}) }
    return;
  }
  if(VID.kind==="youtube"){
    box.innerHTML=`<div class="ph">${t("vidLoading")}</div><div id="ytp"></div>`;
    const myId=VID.id;
    loadYT().then(()=>{
      if(seq!==RENDER_SEQ || VID.kind!=="youtube" || VID.id!==myId || !$("#ytp")) return;   /* source changed meanwhile */
      const vars={start:sec, autoplay:sec?1:0, rel:0, playsinline:1, modestbranding:1, enablejsapi:1};
      if(!FILEPAGE && /^https?:/.test(location.origin)) vars.origin=location.origin;
      YTP=new YT.Player("ytp",{ videoId:myId, width:"100%", height:"100%", playerVars:vars, events:{
        onReady:()=>{ box.querySelector(".ph")?.remove(); if(PENDING_SEC!=null){ const p=PENDING_SEC; PENDING_SEC=null; try{YTP.seekTo(p,true);YTP.playVideo()}catch(e){} } },
        onError:e=>ytFail(e&&e.data)
      }});
    }).catch(why=>{ if(seq===RENDER_SEQ && VID.kind==="youtube" && VID.id===myId) ytFail(why) });
    return;
  }
  /* vimeo / rutube / gdrive / generic iframe */
  box.innerHTML=`<iframe src="${esc(embedSrc(sec))}" title="Match video" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
}
function ytFail(code){
  code = code==null ? "api" : String(code);
  VID.failed=code; killYT();
  renderFail(code, LAST_SEC);
  renderMoments(); renderStatus(); renderTimeline(); renderEpisodes();
}
function failText(code){
  const c=String(code);
  if(c==="offline") return t("vidErrOffline");
  if(c==="api") return t("vidErrApi");
  if(c==="local") return SANDBOX ? t("vidErrLocalSandbox") : t("vidErrLocal");
  if(c==="153") return FILEPAGE ? t("vidErr153") : t("vidErr153Host");
  if(c==="101"||c==="150") return `${t("vidErrEmbed")} (${t("vidCode")} ${c}).`;
  if(c==="100"||c==="2") return `${t("vidErrNotFound")} (${t("vidCode")} ${c}).`;
  return `${t("vidErrPlayer")} (${t("vidCode")} ${c}).`;
}
function renderFail(code, sec){
  const box=$("#player"); if(!box)return;
  const c=String(code), local=c==="local", emb=["153","101","150"].includes(c), out=linkOut(sec||0);
  const open = (VID.kind!=="local" && out) ? `<a class="epbtn" href="${esc(out)}" target="_blank" rel="noopener">▶ ${t("vidOpen")}${sec?" · "+mmss(sec):""}</a>` : "";
  const hints = local ? "" : `<small>${t("vidFixLink")} ${t("vidFixLocal")}${(emb&&FILEPAGE)?" "+t("vidFixHost"):""}</small>`;
  box.innerHTML=`<div class="fail"><b>${t("vidFailT")}</b><span>${esc(failText(code))}</span><div class="row">${open}<button class="epbtn ghost" type="button" data-pick>${t("vidPick")}</button></div>${hints}</div>`;
  box.querySelector("[data-pick]").onclick=()=>$("#vidfile")?.click();
}
function seekTo(min){
  const sec=toSec(min);
  openTab("video");
  if(!VID.kind){ $("#vidurl")?.focus(); return }
  if(linkMode()){ const u=linkOut(sec); if(u) window.open(u,"_blank","noopener"); return }
  if(VID.kind==="local"||VID.kind==="file"){
    const v=$("#videl");
    if(v && v.readyState>=1){ v.currentTime=sec; v.play().catch(()=>{}) }
    else if(v){ v.addEventListener("loadedmetadata",()=>{v.currentTime=sec; v.play().catch(()=>{})},{once:true}) }
    else renderPlayer(sec);
  } else if(VID.kind==="youtube"){
    if(YTP && typeof YTP.seekTo==="function"){ try{ YTP.seekTo(sec,true); YTP.playVideo() }catch(e){ renderPlayer(sec) } }
    else if($("#ytp")) PENDING_SEC=sec;           /* API still loading → apply on ready */
    else renderPlayer(sec);
  } else renderPlayer(sec);                        /* vimeo / rutube: reload at the new second */
  $("#player")?.scrollIntoView({behavior:"smooth",block:"center"});
}

/* ---------- moments & watch buttons ---------- */
function momentsList(){
  const ru=LANG==="ru", ico={goal:"●",yc:"■",sub:"⇅"};
  const ev=M.events.map(e=>({min:e.m, m:`${e.m}'`, tag:(e.t==="TJK"?HN():AN()), txt:e.k==="sub"?`${ico.sub} ${e.in.who} ↔ ${e.out.who}`:`${ico[e.k]} ${e.who} — ${e.k==="goal"?(ru?"гол":"goal"):(ru?"жёлтая карточка":"yellow card")}`, color:e.k==="goal"?"var(--good)":e.k==="yc"?"#E6B800":"var(--ink3)", real:true}));
  const eps=AI.episodes.map(e=>({min:e.min, m:e.m, tag:t("demoTag"), txt:L(e.ti), color:SEVC[e.sev], real:false}));
  return ev.concat(eps).sort((a,b)=>a.min-b.min);
}
function renderMoments(){
  const box=$("#moments"); if(!box)return;
  if(!VID.kind){ box.innerHTML=`<p class="vidnote">${t("vidNoUrl")}</p>`; return }
  const link=linkMode();
  box.innerHTML=momentsList().map(x=>{
    const sec=toSec(x.min), inner=`<span class="m num">${x.m}</span><span><span class="d" style="color:var(--ink)">${esc(x.txt)}</span><br><span class="tg">${esc(x.tag)} · ${mmss(sec)}</span></span><span class="tg" style="color:${x.color}">${link?"↗":"▶"}</span>`;
    return link ? `<a class="mom" href="${esc(linkOut(sec))}" target="_blank" rel="noopener">${inner}</a>` : `<button class="mom" type="button" data-min="${x.min}">${inner}</button>`;
  }).join("");
  box.querySelectorAll("button.mom").forEach(b=>b.onclick=()=>seekTo(parseFloat(b.dataset.min)));
}
/* "watch" affordance for other tabs (timeline list, episodes) */
function watchBtn(min){
  if(!VID.kind) return "";
  const sec=toSec(min);
  if(linkMode()) return `<a class="watchbtn" href="${esc(linkOut(sec))}" target="_blank" rel="noopener">▶ ${t("watch")}</a>`;
  return `<button class="watchbtn" type="button" data-watch="${min}">▶ ${t("watch")}</button>`;
}
function bindWatch(root){ root.querySelectorAll("[data-watch]").forEach(b=>b.onclick=e=>{e.stopPropagation();seekTo(parseFloat(b.dataset.watch))}) }

/* ---------- connecting a source ---------- */
function readOffsets(){ const h1=parseMMSS($("#vidh1").value), h2=parseMMSS($("#vidh2").value); VID.h1=h1==null?0:h1; VID.h2=h2 }
function saveVid(){ try{ localStorage.setItem("fal2-video",JSON.stringify({url:VID.kind==="local"?"":VID.url, h1:VID.h1, h2:VID.h2, name:VID.kind==="local"?VID.name:LASTNAME})) }catch(e){} }
function afterConnect(){ renderVideoUI(); renderPlayer(0); renderTimeline(); renderEpisodes() }
function connectVideo(){
  const url=$("#vidurl").value.trim(), p=parseVideo(url);
  if(!p){ $("#vidmode").textContent=t("vidBad"); return }
  if(VID.kind==="local" && VID.url) URL.revokeObjectURL(VID.url);
  Object.assign(VID,{url:p.url,kind:p.kind,id:p.id,hls:!!p.hls,name:"",failed:null});
  readOffsets(); saveVid(); afterConnect();
}
function useLocalFile(file){
  if(!file) return;
  if(VID.kind==="local" && VID.url) URL.revokeObjectURL(VID.url);
  Object.assign(VID,{url:URL.createObjectURL(file),kind:"local",id:null,hls:false,name:file.name,failed:null});
  LASTNAME=file.name; readOffsets(); saveVid(); afterConnect();
}
function renderStatus(){
  const el=$("#vidmode"); if(!el)return;
  if(!VID.kind){ el.innerHTML=""; return }
  const src = VID.kind!=="local" ? ` <a class="watchbtn" href="${esc(linkOut(LAST_SEC))}" target="_blank" rel="noopener">↗ ${t("vidOpenSrc")}</a>` : "";
  let txt;
  if(VID.kind==="local") txt=`${VID.failed?t("vidFailT")+" —":t("vidModeLocal")} <span class="num" style="color:var(--ink2)">${esc(VID.name)}</span>`;
  else if(SANDBOX) txt=t("vidModeLink");
  else if(VID.failed) txt=t("vidModeFallback");
  else txt=(canSeek()?t("vidModeEmbed"):t("vidModeNoSeek")) + ((FILEPAGE&&VID.kind==="youtube")?" "+t("vidFileWarn"):"");
  const share = shareLink() ? ` <button class="watchbtn" type="button" id="vidshare">${t("vidShare")}</button>` : "";
  el.innerHTML=txt+src+share;
  const sb=$("#vidshare"); if(sb) sb.onclick=()=>copyShare(sb);
  const so=$("#vidshareout"); if(so){ so.hidden=true; so.value="" }
}
function renderVideoUI(){
  const u=$("#vidurl"); if(!u)return;
  u.placeholder=t("vidUrlPh"); if(VID.url && VID.kind!=="local" && !u.value) u.value=VID.url;
  $("#vidh1").value=VID.h1?mmss(VID.h1):""; $("#vidh2").value=VID.h2!=null?mmss(VID.h2):"";
  const fn=$("#vidfname");
  if(fn){ const loc=VID.kind==="local"; fn.innerHTML = loc ? esc(VID.name) : LASTNAME ? `${t("vidLocalPrev")} <b>${esc(LASTNAME)}</b> ${t("vidLocalAgain")}` : ""; fn.className = loc ? "vidnote fname" : "vidnote prevname" }
  renderStatus(); renderMoments();
  const p=$("#player");
  if(!VID.kind) renderPlayer(0);
  else if(VID.failed) renderFail(VID.failed, LAST_SEC);          /* re-render the message in the current language */
  else if(!p.querySelector("iframe,video,#ytp,.fail")) renderPlayer(0);
}
function bindVideo(){
  $("#vidset").onclick=connectVideo;
  $("#vidurl").addEventListener("keydown",e=>{if(e.key==="Enter")connectVideo()});
  ["vidh1","vidh2"].forEach(id=>$("#"+id).addEventListener("change",()=>{ if(VID.kind){ readOffsets(); saveVid(); renderStatus(); renderMoments(); renderTimeline(); renderEpisodes() } }));
  const fi=$("#vidfile");
  $("#vidpick").onclick=()=>fi.click();
  fi.addEventListener("change",()=>{ useLocalFile(fi.files&&fi.files[0]); fi.value="" });
  /* drag & drop: a video file or a link, onto the file box or the player */
  ["#drop","#player"].forEach(sel=>{
    const z=$(sel); if(!z)return;
    z.addEventListener("dragover",e=>{ e.preventDefault(); z.classList.add("drag") });
    z.addEventListener("dragleave",()=>z.classList.remove("drag"));
    z.addEventListener("drop",e=>{
      e.preventDefault(); z.classList.remove("drag");
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f){ useLocalFile(f); return }
      const txt=(e.dataTransfer.getData("text/uri-list")||e.dataTransfer.getData("text/plain")||"").split("\n")[0].trim();
      if(txt && parseVideo(txt)){ $("#vidurl").value=txt; connectVideo() }
    });
  });
}

</script>
<script>
/* ===================== tabs, theme, language, boot ===================== */
"use strict";
const TABS=["overview","stats","dynamics","lineups","passes","players","video","ai","upload"];
function openTab(name){
  document.querySelectorAll("nav.tabs [role=tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===name)));
  document.querySelectorAll("section.tab").forEach(s=>s.hidden = s.id!=="tab-"+name);
  try{history.replaceState(null,"","#"+name)}catch(e){}
  hidePop(); window.scrollTo({top:0,behavior:"instant"});
}
function openAI(pane){
  document.querySelectorAll("#aisub button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.ai===pane)));
  document.querySelectorAll(".aipane").forEach(p=>p.hidden = p.id!=="ai-"+pane);
  if(pane==="pitch" && !$("#psvg")){ buildPitch(); setT(0) }
  openTab("ai");
}
function applyTheme(th){
  document.documentElement.setAttribute("data-theme",th);
  $("#themeico").textContent = th==="dark" ? "☀" : "☾";
  $("#themelbl").textContent = th==="dark" ? t("themeLight") : t("themeDark");
  try{localStorage.setItem("fal2-theme",th)}catch(e){}
}
function applyLang(){
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t(el.dataset.t)});
  $("#lang-ru").setAttribute("aria-pressed",String(LANG==="ru")); $("#lang-en").setAttribute("aria-pressed",String(LANG==="en"));
  $("#hname").textContent=HN(); $("#aname").textContent=AN(); $("#mmeta").textContent=t("meta"); $("#mmeta2").textContent=t("meta");
  document.documentElement.lang = LANG;
  renderKpis(); renderInsights(); renderTimeline(); renderOverviewCharts();
  renderStats(); renderDynamics(); renderLineups(); renderPasses(); renderPlayers(); renderPlayerCard();
  renderAISummary(); renderEpisodes(); renderReport(); renderAssistant(); renderUpload(); renderVideoUI();
  if($("#psvg")){ $("#pitchbox").innerHTML=""; const keep=PT; buildPitch(); setT(keep) }
  const th=document.documentElement.getAttribute("data-theme")||"light"; $("#themelbl").textContent = th==="dark" ? t("themeLight") : t("themeDark");
  $("#foot").textContent=t("foot");
}
function setLang(l){ LANG=l; try{localStorage.setItem("fal2-lang",l)}catch(e){} applyLang() }
$("#lang-ru").onclick=()=>setLang("ru"); $("#lang-en").onclick=()=>setLang("en");
$("#themebtn").onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
document.querySelectorAll("nav.tabs [role=tab]").forEach(b=>b.onclick=()=>{ if(b.dataset.tab==="ai"){openAI(document.querySelector("#aisub [aria-pressed=true]")?.dataset.ai||"summary")} else openTab(b.dataset.tab) });
document.querySelectorAll("#aisub button").forEach(b=>b.onclick=()=>openAI(b.dataset.ai));
document.querySelectorAll("#halfseg button").forEach(b=>b.onclick=()=>{HALF=+b.dataset.half;renderStats()});
$("#btn-play").onclick=()=>playing?pause():play(); $("#btn-restart").onclick=()=>{pause();setT(0)};
$("#scrub").oninput=e=>{pause();setT(parseFloat(e.target.value))};
$("#askbtn").onclick=()=>ask($("#askbox").value,null); $("#askbox").addEventListener("keydown",e=>{if(e.key==="Enter")ask($("#askbox").value,null)});

(async()=>{
  let th="light"; try{th=localStorage.getItem("fal2-theme")||"light"}catch(e){}
  applyTheme(th);
  applyLang(); bindUpload(); bindVideo();
  const h=(location.hash||"").replace("#","");
  if(TABS.includes(h)) (h==="ai"?openAI("summary"):openTab(h)); else openTab("overview");
  if(window.claude?.use){ try{ sampleFn=await claude.use("sample") }catch(e){ sampleFn=null } }
  renderAssistant();
})();

/* hosted-build hand-off: the claude.ai viewer (parent page) may ask this frame for demo-hosted.html, published next to the page */
window.addEventListener("message", async e=>{
  if(!e.data || e.data.type!=="fal-source" || window.parent===window) return;
  let host=""; try{ host=new URL(e.origin).hostname }catch(x){}
  if(!/(^|\.)claude\.ai$/.test(host)) return;
  try{ const r=await fetch("demo-hosted.html"); if(!r.ok) throw new Error("HTTP "+r.status); const html=await r.text(); e.source.postMessage({type:"fal-source",html},e.origin) }
  catch(err){ e.source.postMessage({type:"fal-source",error:String(err&&err.message||err)},e.origin) }
});

</script>
